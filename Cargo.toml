[package]
name = "taskmanager-rs"
version = "0.1.0"
license = "MIT"
edition = "2024"

[dependencies]
# gpui-fast (a standalone GPUI fork with faster layout), tracked through our own
# fork so we can carry fixes (branch fast/vulkan-first-backends: skip loading
# Mesa/LLVM through EGL when Vulkan works). Pinned to a known commit; bump `rev` deliberately.
gpui = { git = "https://github.com/trevortomlin/gpui-fast", rev = "2c472d8e55426ad988a6d0d6f0c2f677a6c2dc53" }
gpui_platform = { git = "https://github.com/trevortomlin/gpui-fast", rev = "2c472d8e55426ad988a6d0d6f0c2f677a6c2dc53", features = ["font-kit", "wayland", "x11"] }
rustix = { version = "1.1.6", features = ["process"] }
sysinfo = "0.40.1"
unicode-segmentation = "1.13.3"

# gpui is far too slow unoptimized (~30 fps); optimize dependencies even in dev
# builds while keeping this crate fast to compile and debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
