[package]
name = "taskmanager-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# crates.io gpui (0.2.2) is stale and fails to build against current deps,
# so track Zed's repo pinned to a known commit. Bump `rev` deliberately.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", features = ["font-kit", "wayland", "x11"] }
rustix = { version = "1.1.6", features = ["process"] }
sysinfo = "0.40.1"
unicode-segmentation = "1.13.3"
